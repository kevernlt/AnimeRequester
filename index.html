<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeRequester</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script type="module" src="JS/script.js" defer></script>
</head>

<body>
    <nav class="topbar">
        <div class="topbar-container">
            <div class="topbar-logo">
                <a href="#">
                    <img src="favicon.png" alt="Logo">
                    <span>
                        <span class="topbar-title">Anime</span>Requester
                    </span>
                </a>
            </div>

            <button class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="topbar-content">
                <ul class="topbar-nav">
                    <li>
                        <a href="#">
                            Accueil
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            Replace
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            Replace
                        </a>
                    </li>
                </ul>

                <div class="topbar-actions">
                    <a href="#" class="btn-top btn-login">
                        Connexion
                    </a>
                    <a href="#" class="btn-top btn-register">
                        Inscription
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1 class="main-title">Rechercher un animé</h1>
        <div class="form-card">
            <form action="">
                <div class="form-group">
                    <label for="search-type" class="form-label">Choisissez un type de recherche :</label>
                    <select id="search-type" class="form-control">
                        <option value="title">Rechercher par titre</option>
                        <option value="gender">Rechercher par genre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="param" class="form-label">Paramètre :</label>
                    <input type="text" id="param" class="form-control">
                </div>

                <div class="form-group">
                    <label for="pages" class="form-label">Nombre de résultats par page :</label>
                    <input type="number" id="pages" class="form-control" placeholder="10">
                </div>

                <div class="button-group">
                    <input type="submit" class="btn" id="searchBtn" value="Rechercher">
                    <input type="reset" class="btn" id="eraseBtn" value="Effacer">
                </div>
            </form>
        </div>
        <div id="resultBoard">
        </div>
    </main>
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-row">
                <div class="footer-brand">
                    <h4>
                        <span>Anime</span>Requester
                    </h4>
                    <p class="footer-muted footer-small">
                        Projet R301 - BUT Informatique
                    </p>
                    <p class="footer-muted footer-small">
                        &copy; 2026 Tout droits réservés.
                    </p>
                </div>
            
                <div class="footer-column">
                    <h5>Équipe</h5>
                    <ul>
                        <li><a href="#">Les Charpentiers</a></li>
                    </ul>
                </div>

                <div class="footer-column">
                    <h5>À propos</h5>
                    <ul>
                        <li><a href="#">Mentions légales</a></li>
                        <li><a href="#">Conditions générales d'utilisation</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
