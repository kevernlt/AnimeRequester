<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeRequester</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="CSS/style.css">
    <script type="module" src="JS/script.js" defer></script>
</head>

<body>
    <nav class="topbar">
        <div class="topbar-container">
            <div class="topbar-logo">
                <a href="index.html">
                    <img src="favicon.png" alt="Logo">
                    <span>
                        <span class="topbar-title">Anime</span>Requester
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1 class="main-title">Rechercher un animé</h1>
        <div class="form-card">
            <form action="">
                <div class="form-group">
                    <label for="search-type" class="form-label">Choisissez un type de recherche :</label>
                    <select id="search-type" class="form-control">
                        <option value="title">Rechercher par titre</option>
                        <option value="gender">Rechercher par genre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="param" class="form-label">Paramètre :</label>
                    <input type="text" id="param" class="form-control">
                    <select id="genre" class="form-control" hidden>
                        <option value="">Choisissez un genre</option>
                        <option value="Action">Action</option>
                        <option value="Aventure">Aventure</option>
                        <option value="Comédie">Comédie</option>
                        <option value="Drame">Drame</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Horreur">Horreur</option>
                        <option value="Romance">Romance</option>
                        <option value="Science-fiction">Science-fiction</option>
                        <option value="Sport">Sport</option>
                        <option value="Thriller">Thriller</option>
                    </select>
                </div>

                <div class="button-group">
                    <input type="submit" class="btn" id="searchBtn" value="Rechercher">
                    <input type="reset" class="btn" id="eraseBtn" value="Effacer">
                </div>
            </form>
        </div>
        <div id="resultBoard">
        </div>
    </main>
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-row">
                <div class="footer-brand">
                    <h4>
                        <span>Anime</span>Requester
                    </h4>
                    <p class="footer-muted footer-small">
                        Projet R301 - BUT Informatique
                    </p>
                    <p class="footer-muted footer-small">
                        &copy; 2026 Tout droits réservés.
                    </p>
                </div>
            
                <div class="footer-column">
                    <h5>Équipe</h5>
                    <ul>
                        <li><a href="pages/charpentiers.html">Les Charpentiers</a></li>
                    </ul>
                </div>

                <div class="footer-column">
                    <h5>À propos</h5>
                    <ul>
                        <li><a href="pages/mentions-legales.html">Mentions légales</a></li>
                        <li><a href="#">Conditions générales d'utilisation</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
